kind = "web"
previewPath = "/"
title = "BRYXA Digital"
version = "1.0.0"
id = "artifacts/bryxa-digital"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18767

[services.development]
run = "pnpm --filter @workspace/bryxa-digital run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bryxa-digital", "run", "build" ]
publicDir = "artifacts/bryxa-digital/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18767"
BASE_PATH = "/"
